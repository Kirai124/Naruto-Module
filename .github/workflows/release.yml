name: Build Foundry Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.8.2"
        required: true
        default: "v0.8.2"

permissions:
  contents: write

jobs:
  release:
    name: Build and upload module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate module.json version
        shell: bash
        run: |
          MANIFEST_VERSION="$(jq -r '.version' module.json)"
          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$MANIFEST_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch!"
            echo "module.json: $MANIFEST_VERSION"
            echo "Release tag: ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Build Foundry module ZIP
        shell: bash
        run: |
          ZIP_NAME="n5eb-classmod-library-${{ steps.version.outputs.version }}.zip"

          zip -r "$ZIP_NAME" \
            module.json \
            assets \
            data \
            scripts \
            styles \
            README.md \
            -x "*.DS_Store" "*.git*"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ZIP_NAME="n5eb-classmod-library-${RELEASE_VERSION}.zip"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Uploading assets..."
            gh release upload "$RELEASE_TAG" \
              module.json \
              "$ZIP_NAME" \
              --clobber
          else
            echo "Creating new release..."
            gh release create "$RELEASE_TAG" \
              module.json \
              "$ZIP_NAME" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
